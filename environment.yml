# Source-build dependencies only. Optional regression tools are documented in
# docs/testing.md; core BAM binning needs neither Python nor external samtools.
name: rabbitbin
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - cmake >=3.16
  - make
  - c-compiler
  - cxx-compiler
  - boost-cpp >=1.66
  - zlib >=1.2.11
  - htslib >=1.13
  - libdeflate
  - pkg-config
  - git
