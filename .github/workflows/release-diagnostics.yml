name: release-runtime-diagnostics
on:
  push:
    branches: ['fix/install-compatibility-20261009']
    paths: ['.github/workflows/release-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  read-runtime-log:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the failed unpacked-runtime check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 37914866905 --repo "$GITHUB_REPOSITORY" \
            --job 113769571814 --log-failed > "$RUNNER_TEMP/runtime.log"
          message=$(cut -f3- "$RUNNER_TEMP/runtime.log" | tail -n 35)
          message=${message//%/%25}
          message=${message//$'\r'/%0D}
          message=${message//$'\n'/%0A}
          printf '::notice title=Runtime failure details::%s\n' "$message"
