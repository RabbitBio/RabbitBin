name: linux-binary-release

on:
  push:
    branches: ['main']
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-release-${{ github.ref }}
  # Supersede outdated branch builds, but never interrupt a tagged publication.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verified-artifact:
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.lookup.outputs.run_id }}
    steps:
      - name: Reuse the exact commit's fully validated main-branch artifact
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            exit 0
          fi
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f status=success \
            --jq '[.workflow_runs[] | select(.head_branch == "main")][0].id // empty')
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

  build:
    needs: verified-artifact
    if: needs.verified-artifact.outputs.run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: rockylinux:8
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and test tools
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          dnf install -y gcc gcc-c++ cmake make git autoconf automake libtool \
            pkgconf-pkg-config boost-devel python3 samtools patchelf binutils tar gzip which findutils
      - uses: actions/checkout@v7
      - name: Verify version and configure
        run: |
          # The container runs as root while checkout files belong to the host
          # runner. Trust only this checkout, never all mounted repositories.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
          fi
          cmake -S . -B "$RUNNER_TEMP/build" -DCMAKE_BUILD_TYPE=Release \
            -DRABBITBIN_NATIVE_ARCH=OFF -DRABBITBIN_USE_SYSTEM_ZLIB=OFF \
            -DRABBITBIN_USE_SYSTEM_HTSLIB=OFF -DRABBITBIN_USE_SYSTEM_LIBDEFLATE=OFF
      - name: Build, test and package
        run: |
          cmake --build "$RUNNER_TEMP/build" --parallel 2 2>&1 | tee "$RUNNER_TEMP/release-build.log"
          (cd "$RUNNER_TEMP/build" && ctest --output-on-failure --timeout 180 -j2) 2>&1 | tee "$RUNNER_TEMP/release-test.log"
          bash scripts/package_linux.sh "$RUNNER_TEMP/build" "$RUNNER_TEMP/dist" 2>&1 | tee "$RUNNER_TEMP/release-package.log"
          git archive --format=tar.gz --prefix="rabbitbin-$(tr -d '\r\n' < VERSION)-source/" \
            --output="$RUNNER_TEMP/dist/rabbitbin-$(tr -d '\r\n' < VERSION)-source.tar.gz" HEAD
          (cd "$RUNNER_TEMP/dist" && sha256sum *-source.tar.gz > source.sha256)
      - name: Expose build failure diagnostics
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/release-*.log; do
            if [ -f "$log" ]; then
              message=$(tail -n 60 "$log")
              message=${message//%/%25}
              message=${message//$'\r'/%0D}
              message=${message//$'\n'/%0A}
              printf '::notice title=%s::%s\n' "${log##*/}" "$message"
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.sha256
          if-no-files-found: error

  clean-runtime:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['rockylinux:8', 'ubuntu:22.04', 'ubuntu:24.04']
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-release
          path: dist
      - name: Verify and test without installing dependencies
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          cd dist
          sha256sum -c ./*linux*.sha256
          mkdir unpacked
          tar -xzf ./*linux*.tar.gz -C unpacked
          package=$(find "$PWD/unpacked" -mindepth 1 -maxdepth 1 -type d)
          docker run --rm --network none -v "$package:/opt/rabbitbin:ro" \
            "$TEST_IMAGE" bash /opt/rabbitbin/test/binary_smoke.sh

  publish:
    if: >-
      always() && !cancelled() && startsWith(github.ref, 'refs/tags/') &&
      needs.verified-artifact.result == 'success' &&
      (needs.verified-artifact.outputs.run_id != '' ||
       (needs.build.result == 'success' && needs.clean-runtime.result == 'success'))
    needs: [verified-artifact, build, clean-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-release
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ needs.verified-artifact.outputs.run_id || github.run_id }}
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(tr -d '\r\n' < VERSION)"
          (cd dist && sha256sum -c ./*linux*.sha256 && sha256sum -c source.sha256)
          tar -xOf dist/*linux*.tar.gz "rabbitbin-$(tr -d '\r\n' < VERSION)-linux-x86_64-glibc2.28/BUILDINFO.txt" \
            | grep -Fx "commit=$GITHUB_SHA"
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 \
            --verify-tag --title "RabbitBin $RELEASE_TAG — Linux x86-64" \
            --notes-file packaging/RELEASE_NOTES.md
