name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilers:
    name: ${{ matrix.compiler }} / Ubuntu 24.04
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-all-dev zlib1g-dev \
            libhts-dev libdeflate-dev libomp-dev python3 samtools
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/install"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure -R '^test_rabbitbin$'
          ctest --test-dir build --output-on-failure -j2
      - name: Install and smoke test
        run: |
          cmake --install build
          python3 test/test_installation.py --prefix "$PWD/install" --source "$PWD"

  conda:
    name: Current Conda C/C++ toolchain
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: rabbitbin
          environment-file: environment.yml
          channel-priority: strict
          miniforge-version: latest
      - name: Configure, build and test
        run: |
          cmake -S . -B build-conda -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build-conda --parallel 2
          ctest --test-dir build-conda --output-on-failure -j2
          cmake --install build-conda
          python3 test/test_installation.py --prefix "$PWD/install" --source "$PWD" \
            --build-dir build-conda --dependency-prefix "$CONDA_PREFIX"

  bundled-dependencies:
    name: Source archive and pinned dependency fallback
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install only required build tools and Boost
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git autoconf \
            automake libtool pkg-config libboost-all-dev python3 samtools
      - name: Export a source archive without Git metadata
        run: |
          mkdir "$RUNNER_TEMP/rabbitbin-source"
          git archive --format=tar --output="$RUNNER_TEMP/rabbitbin-source.tar" HEAD
          tar -xf "$RUNNER_TEMP/rabbitbin-source.tar" -C "$RUNNER_TEMP/rabbitbin-source"
          test "$(tr -d '\n' < "$RUNNER_TEMP/rabbitbin-source/SOURCE_REVISION")" = "$GITHUB_SHA"
          # Archives preserve commit timestamps. A developer clock ahead of
          # the runner can otherwise make Ninja regenerate its manifest forever.
          date -u
          stat -c '%y %n' "$RUNNER_TEMP/rabbitbin-source/CMakeLists.txt"
          find "$RUNNER_TEMP/rabbitbin-source" -type f -exec touch -m {} +
      - name: Configure with all bundled fallbacks
        run: >-
          cmake -S "$RUNNER_TEMP/rabbitbin-source" -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/install"
          -DRABBITBIN_USE_SYSTEM_ZLIB=OFF
          -DRABBITBIN_USE_SYSTEM_HTSLIB=OFF
          -DRABBITBIN_USE_SYSTEM_LIBDEFLATE=OFF
      - name: Build and smoke test
        run: |
          cmake --build build --parallel 2 2>&1 | tee "$RUNNER_TEMP/archive-build.log"
          ctest --test-dir build --output-on-failure -j2 2>&1 | tee "$RUNNER_TEMP/archive-test.log"
          actual=$(./build/src/rabbitbin --version)
          expected="RabbitBin $(tr -d '\n' < VERSION) (commit ${GITHUB_SHA::12})"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Archive version mismatch: actual=$actual expected=$expected"
            exit 1
          fi
          cmake --install build
          python3 test/test_installation.py --prefix "$PWD/install" --source "$PWD" 2>&1 | tee "$RUNNER_TEMP/archive-smoke.log"
      - name: Expose archive failure diagnostics
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/archive-*.log; do
            if [ -f "$log" ]; then
              message=$(tail -n 80 "$log")
              message=${message//%/%25}
              message=${message//$'\r'/%0D}
              message=${message//$'\n'/%0A}
              printf '::notice title=%s::%s\n' "${log##*/}" "$message"
            fi
          done

  container:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: >-
          docker build
          --build-arg RABBITBIN_SOURCE_REVISION="${GITHUB_SHA::12}"
          -t rabbitbin:ci .
      - name: Smoke test image
        run: |
          docker run --rm rabbitbin:ci sh -c \
            'ldd /usr/local/bin/rabbitbin && rabbitbin --version'
